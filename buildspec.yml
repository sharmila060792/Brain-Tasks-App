version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-south-2"
    EKS_CLUSTER_NAME: "Brain-Project-EKS"
    ACCOUNT_ID: "772721871298"
    REPO_NAME: "brain-tasks-app"

phases:
  install:
    commands:
      - echo "Installing kubectl via Python..."
      - rm -f /usr/local/bin/kubectl
      - python3 -c "import urllib.request; host = 's3.us-west-2' + '.amazonaws.com'; path = '/amazon-eks/1.32.0/2024-12-20/bin/linux/amd64/kubectl'; urllib.request.urlretrieve('https://' + host + path, '/usr/local/bin/kubectl')"
      - chmod +x /usr/local/bin/kubectl
      - kubectl version --client


  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - REPO_URI="${REGISTRY}/${REPO_NAME}"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REGISTRY
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${IMAGE_TAG:=latest}

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $REPO_URI:latest .
      - docker tag $REPO_URI:latest $REPO_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Pushing Docker image to ECR..."
      - docker push $REPO_URI:latest
      - docker push $REPO_URI:$IMAGE_TAG
      - echo "Updating kubeconfig and deploying to EKS..."
      - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $EKS_CLUSTER_NAME
      - ls -la
      - kubectl apply -f deployment.yaml || kubectl apply -f deployement.yaml || kubectl apply -f k8s/
      - kubectl apply -f service.yaml || kubectl apply -f k8s/service.yaml
      - kubectl set image deployment/brain-app-deployment brain-app=$REPO_URI:$IMAGE_TAG
      - kubectl rollout status deployment/brain-app-deployment
      - kubectl get svc
